name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: "Build with KernelSU-Next + SUSFS"
        required: true
        type: boolean
        default: true
      ksu_repo:
        description: "KernelSU-Next repository"
        required: true
        type: string
        default: "https://github.com/sidex15/KernelSU-Next"
      ksu_branch:
        description: "KernelSU-Next branch (non-GKI + SUSFS v2)"
        required: true
        type: string
        default: "legacy-susfs-v2"
      clang_url:
        description: "Clang toolchain (.tar.gz)"
        required: true
        type: string
        default: "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
      release:
        description: "Publish a GitHub release"
        required: true
        type: boolean
        default: false

env:
  DEFCONFIG: "vendor/xiaomi/miatoll_defconfig"
  KSU: ${{ inputs.ksu }}
  KSU_REPO: ${{ inputs.ksu_repo || 'https://github.com/sidex15/KernelSU-Next' }}
  KSU_BRANCH: ${{ inputs.ksu_branch || 'legacy-susfs-v2' }}
  CLANG_URL: ${{ inputs.clang_url || 'https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz' }}
  KBUILD_BUILD_USER: ${{ github.repository_owner }}
  KBUILD_BUILD_HOST: "github-actions"

jobs:
  build:
    name: Build (${{ inputs.ksu && 'KSUN-SUSFS' || 'NoKSU' }})
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends \
            bc bison build-essential ccache curl flex git libssl-dev \
            libelf-dev lzop python3 unzip zip zlib1g-dev cpio

      - name: Cache clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ hashFiles('.github/workflows/build.yml') }}-${{ env.CLANG_URL }}

      - name: Download clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          curl -LSs "$CLANG_URL" | tar -xzf - -C clang

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.KSU }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.KSU }}-
            ccache-

      - name: Set up KernelSU-Next
        if: env.KSU == 'true'
        run: |
          # drivers/kernelsu is a symlink to ../KernelSU/kernel; the Makefile and Kconfig entries are already in tree
          git clone --depth 1 -b "$KSU_BRANCH" "$KSU_REPO" KernelSU
          echo "KernelSU-Next: $(git -C KernelSU log -1 --format='%h %s')"

      - name: Drop KernelSU from config
        if: env.KSU != 'true'
        run: |
          # drivers/kernelsu only exists after the KernelSU clone, and 4.14 Kconfig
          # has no optional source, so unhook it as well
          sed -i '/CONFIG_KSU/d' "arch/arm64/configs/${DEFCONFIG}"
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig
          sed -i '/kernelsu\//d' drivers/Makefile

      - name: Build
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          ccache -M 3G
          # LLVM_IAS=1 makes clang use its own assembler; LTO still falls back to
          # GNU gold unless ld.lld and the llvm tools are named explicitly
          MAKE_ARGS=(O=out LLVM=1 LLVM_IAS=1 CC="ccache clang" LD=ld.lld
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-)
          make "${MAKE_ARGS[@]}" "${DEFCONFIG}"
          make -j"$(nproc --all)" "${MAKE_ARGS[@]}" \
            Image.gz dtbo.img dtb.img 2>&1 | tee build.log
          rc="${PIPESTATUS[0]}"
          if [ "$rc" -ne 0 ]; then
            # surface compiler/linker errors as annotations (readable without downloading the log)
            grep -E 'error:|Error [0-9]|undefined reference|undefined symbol|ld.lld:' build.log | grep -v '^make\[' | sort -u | head -40 |
              while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          fi
          exit "$rc"

      - name: Check config
        run: |
          grep -E 'CONFIG_LOCALVERSION=|CONFIG_MEMCG=|CONFIG_PSI=|CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_SUSFS=' out/.config || true
          ccache -s

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package AnyKernel3
        id: pack
        run: |
          git clone -q --depth 1 -b miatoll https://github.com/RapliVx/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github
          # name, version, banner and device list are hardcoded in the repo:
          # CONFIG_LOCALVERSION in the defconfig and the anykernel/ folder
          cp anykernel/anykernel.sh anykernel/banner AnyKernel3/
          version=$(sed -n 's/^CONFIG_LOCALVERSION="-\(.*\)"/\1/p' out/.config)
          root=$([ "$KSU" = true ] && echo "KernelSU-Next + SUSFS" || echo "none (stock)")
          sed -i -e "s/@VERSION@/${version}/" -e "s/@ROOT@/${root}/" AnyKernel3/banner
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          # AnyKernel3 replaces the boot dtb only when the file is named "dtb"
          cp out/arch/arm64/boot/dtb.img AnyKernel3/dtb
          variant=$([ "$KSU" = true ] && echo KSUN-SUSFS || echo NoKSU)
          zip_name="${version}-miatoll-${variant}-$(date +%Y%m%d)-${GITHUB_SHA::7}.zip"
          rm -f AnyKernel3/README.md
          (cd AnyKernel3 && zip -r9 "../${zip_name}" .)
          echo "zip=${zip_name}" >> "$GITHUB_OUTPUT"
          echo "name=${zip_name%.zip}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # GitHub always wraps an artifact in a zip, so upload the AnyKernel3 folder itself:
      # the downloaded artifact is then the flashable zip (a zip inside a zip fails in recovery)
      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: AnyKernel3/
          include-hidden-files: true

      - name: Release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.pack.outputs.version }}"
          name: "${{ steps.pack.outputs.version }}"
          files: ${{ steps.pack.outputs.zip }}
          body: |
            Device: Redmi Note 9 Pro / Note 9S / Poco M2 Pro / Note 9 Pro Max (miatoll)
            KernelSU-Next: ${{ env.KSU == 'true' && format('{0} @ {1}', env.KSU_REPO, env.KSU_BRANCH) || 'not included' }}
