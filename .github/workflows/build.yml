name: Build Kernel

# Release: push a tag like v1.1 (stable) or v1.1-beta1 (pre-release) -> builds KSU + NoKSU and publishes
# Test build: Run workflow on any branch -> version is <branch>-<commit> (or the version input), no release.
#   Inputs pick the variants (KSU, NoKSU or both in one run), the BakaSU ref, extra config and outputs.
# Telegram: every build is sent to the chat when the TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets are set
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      variant:
        description: "Variants to build"
        required: true
        type: choice
        options:
          - both
          - ksu
          - noksu
        default: both
      version:
        description: "Version (optional, default <branch>-<commit>)"
        required: false
        type: string
        default: ""
      ksu_ref:
        description: "BakaSU branch, tag or commit"
        required: false
        type: string
        default: "main"
      ksu_debug:
        description: "KSU: CONFIG_KSU_DEBUG (verbose KernelSU logs)"
        required: false
        type: boolean
        default: false
      config:
        description: "Extra config, space separated (CONFIG_FOO=y CONFIG_BAR=n CONFIG_BAZ=123)"
        required: false
        type: string
        default: ""
      clean:
        description: "Clean build (no ccache)"
        required: false
        type: boolean
        default: false
      telegram:
        description: "Send zips to Telegram"
        required: false
        type: boolean
        default: true
      build_log:
        description: "Upload the build log even when the build succeeds"
        required: false
        type: boolean
        default: false

env:
  DEFCONFIG: "vendor/xiaomi/miatoll_defconfig"
  KSU_REPO: "https://github.com/Baka-SU/BakaSU"
  KSU_BRANCH: ${{ inputs.ksu_ref || 'main' }}
  CLANG_URL: "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
  KBUILD_BUILD_USER: ${{ github.repository_owner }}
  KBUILD_BUILD_HOST: "github-actions"

jobs:
  build:
    name: Build (${{ matrix.ksu && 'BakaSU-SUSFS' || 'NoKSU' }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # tag push and variant=both build both; otherwise only the chosen one
        ksu: ${{ fromJSON((github.event_name == 'push' || inputs.variant == 'both') && '[true, false]' || (inputs.variant == 'ksu' && '[true]' || '[false]')) }}
    env:
      KSU: ${{ matrix.ksu }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          # kernel name comes from CONFIG_LOCALVERSION, the version from the tag
          name=$(sed -n 's/^CONFIG_LOCALVERSION="-\(.*\)"/\1/p' "arch/arm64/configs/${DEFCONFIG}")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          elif [ -n "$VERSION_INPUT" ]; then
            # goes into the zip name and kernel release, so keep it to one safe word
            version=$(printf '%s' "$VERSION_INPUT" | tr -c 'A-Za-z0-9._-' '-')
          else
            version="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          fi
          variant=$([ "$KSU" = true ] && echo KSU || echo NoKSU)
          # zip name: name-version-device-type-date
          echo "KERNEL_NAME=${name}" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${name}-${version}-miatoll-${variant}-$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "${name} ${version} (${variant})"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends \
            bc bison build-essential ccache curl flex git libssl-dev \
            libelf-dev lzop python3 unzip zip zlib1g-dev cpio

      - name: Cache clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ env.CLANG_URL }}

      - name: Download clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          curl -LSs "$CLANG_URL" | tar -xzf - -C clang

      - name: Cache ccache
        if: ${{ !inputs.clean }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.ksu }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.ksu }}-
            ccache-

      - name: Set up BakaSU
        if: matrix.ksu
        run: |
          # drivers/kernelsu is a symlink to ../KernelSU/kernel; the Makefile and Kconfig entries are already in tree
          # full history (blobless): BakaSU's version code is 30000 + commit count + 700,
          # and its Kbuild needs KernelSU/.git, so no shallow clone and no plain copy
          # clone then checkout, so KSU_BRANCH may also be a tag or a commit
          git clone --filter=blob:none "$KSU_REPO" KernelSU
          git -C KernelSU checkout -q "$KSU_BRANCH"
          echo "BakaSU: $(git -C KernelSU log -1 --format='%h %s') ($(git -C KernelSU rev-list --count HEAD) commits)"
          echo "KSU_COMMIT=$(git -C KernelSU log -1 --format=%h)" >> "$GITHUB_ENV"

      - name: Drop KernelSU from config
        if: ${{ !matrix.ksu }}
        run: |
          # drivers/kernelsu only exists after the KernelSU clone, and 4.14 Kconfig
          # has no optional source, so unhook it as well
          sed -i '/CONFIG_KSU/d' "arch/arm64/configs/${DEFCONFIG}"
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig
          sed -i '/kernelsu\//d' drivers/Makefile

      - name: Build
        env:
          EXTRA_CONFIG: ${{ inputs.config }}
          KSU_DEBUG: ${{ inputs.ksu_debug }}
          CLEAN: ${{ inputs.clean }}
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          if [ "$CLEAN" = true ]; then export CCACHE_DISABLE=1; fi
          ccache -M 3G
          # LLVM_IAS=1 makes clang use its own assembler; LTO still falls back to
          # GNU gold unless ld.lld and the llvm tools are named explicitly.
          # LOCALVERSION is appended to CONFIG_LOCALVERSION: 4.14.356-<name>-<version>
          MAKE_ARGS=(O=out LLVM=1 LLVM_IAS=1 CC="ccache clang" LD=ld.lld
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- LOCALVERSION="-${VERSION}")
          make "${MAKE_ARGS[@]}" "${DEFCONFIG}"
          # dispatch toggles on top of the defconfig
          extra="$EXTRA_CONFIG"
          if [ "$KSU" = true ] && [ "$KSU_DEBUG" = true ]; then extra="$extra CONFIG_KSU_DEBUG=y"; fi
          if [ -n "${extra// /}" ]; then
            for opt in $extra; do
              case "$opt" in
                CONFIG_*=n) scripts/config --file out/.config --disable "${opt%%=*}" ;;
                CONFIG_*=*) scripts/config --file out/.config --set-val "${opt%%=*}" "${opt#*=}" ;;
                *) echo "::error::bad config entry '$opt' (want CONFIG_NAME=value)"; exit 1 ;;
              esac
            done
            make "${MAKE_ARGS[@]}" olddefconfig
            for opt in $extra; do
              name="${opt%%=*}"
              # a dependency can silently drop an option; say so instead of building something else
              got=$(grep -E "^${name}=|^# ${name} is not set" out/.config || echo "${name} missing")
              echo "config: requested ${opt} -> ${got}"
              case "$opt" in
                *=n) case "$got" in "# ${name} is not set"|"${name} missing") ;; *) echo "::warning::${opt} did not apply (${got})" ;; esac ;;
                *) [ "$got" = "$opt" ] || [ "$got" = "${name}=\"${opt#*=}\"" ] || echo "::warning::${opt} did not apply (${got})" ;;
              esac
            done
          fi
          make -j"$(nproc --all)" "${MAKE_ARGS[@]}" \
            Image.gz dtbo.img dtb.img 2>&1 | tee build.log
          rc="${PIPESTATUS[0]}"
          if [ "$rc" -ne 0 ]; then
            # surface compiler/linker errors as annotations (readable without downloading the log)
            grep -E 'error:|Error [0-9]|undefined reference|undefined symbol|ld.lld:' build.log | grep -v '^make\[' | sort -u | head -40 |
              while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          fi
          exit "$rc"

      - name: Check build
        run: |
          cat out/include/config/kernel.release
          grep -E 'CONFIG_MEMCG=|CONFIG_PSI=|CONFIG_KSU=|CONFIG_KSU_SUSFS=' out/.config || true
          ccache -s

      - name: Upload build log
        if: ${{ failure() || inputs.build_log }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.ksu && 'ksu' || 'noksu' }}
          path: build.log

      - name: Package AnyKernel3
        run: |
          git clone -q --depth 1 -b miatoll https://github.com/RapliVx/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/README.md
          # banner, kernel string and device list are hardcoded in anykernel/
          cp anykernel/anykernel.sh anykernel/banner AnyKernel3/
          root=$([ "$KSU" = true ] && echo "BakaSU + SUSFS" || echo "none (stock)")
          sed -i -e "s/@VERSION@/${KERNEL_NAME} ${VERSION}/" -e "s/@ROOT@/${root}/" AnyKernel3/banner
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          # AnyKernel3 replaces the boot dtb only when the file is named "dtb"
          cp out/arch/arm64/boot/dtb.img AnyKernel3/dtb
          (cd AnyKernel3 && zip -r9 "../${ZIP_NAME}.zip" .)

      # GitHub always wraps an artifact in a zip, so upload the AnyKernel3 folder itself:
      # the downloaded artifact is then the flashable zip (a zip inside a zip fails in recovery)
      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: AnyKernel3/
          include-hidden-files: true

      - name: Upload to Telegram
        if: ${{ github.event_name == 'push' || inputs.telegram }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_THREAD: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::notice::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set, skipping Telegram upload"
            exit 0
          fi
          root=$([ "$KSU" = true ] && echo "BakaSU + SUSFS (${KSU_COMMIT})" || echo "none")
          # plain text caption (no parse_mode), so commit subjects need no escaping
          caption=$(printf '%s %s\nDevice: miatoll\nRoot: %s\nKernel: %s\nCommit: %s@%s %s\n%s' \
            "$KERNEL_NAME" "$VERSION" "$root" "$(cat out/include/config/kernel.release)" \
            "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$(git log -1 --format=%s | cut -c1-200)" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          args=(-F chat_id="$TG_CHAT" -F document=@"${ZIP_NAME}.zip" --form-string caption="$caption")
          if [ -n "$TG_THREAD" ]; then args+=(-F message_thread_id="$TG_THREAD"); fi
          resp=$(curl -sS --retry 3 "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" "${args[@]}")
          if ! printf '%s' "$resp" | grep -q '"ok":true'; then
            # the kernel built fine; a Telegram problem should not fail the build
            echo "::warning::Telegram upload failed: $(printf '%s' "$resp" | sed -n 's/.*"description":"\([^"]*\)".*/\1/p')"
            exit 0
          fi
          echo "Sent ${ZIP_NAME}.zip to Telegram"

      - name: Upload zip for release
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.ksu && 'ksu' || 'noksu' }}
          path: ${{ env.ZIP_NAME }}.zip
          compression-level: 0

  release:
    name: Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect zips
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LazyExec ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: "*.zip"
          body: |
            Device: Redmi Note 9 Pro / Note 9S / Poco M2 Pro / Note 9 Pro Max (miatoll)
            - KSU: BakaSU + SUSFS v2.3.0 (${{ env.KSU_REPO }} @ ${{ env.KSU_BRANCH }})
            - NoKSU: no root
